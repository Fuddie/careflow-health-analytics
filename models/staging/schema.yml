version: 2

models:
  - name: stg_patients
    description: Clean patient master data. One row per patient.
    columns:
      - name: patient_id
        tests: [not_null, unique]
      - name: sex
        tests:
          - accepted_values:
              values: ['F', 'M']
      - name: payer_type
        tests:
          - accepted_values:
              values: ['SELF_PAY', 'PRIVATE_INSURANCE', 'HMO']

  - name: stg_facilities
    description: Clean facility master data. One row per facility.
    columns:
      - name: facility_id
        tests: [not_null, unique]
      - name: licensed_beds
        tests: [not_null]

  - name: stg_clinicians
    description: Clean clinician roster data. One row per clinician.
    columns:
      - name: clinician_id
        tests: [not_null, unique]
      - name: facility_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_facilities')
              field: facility_id

  - name: stg_appointments
    description: Clean appointment data. One row per appointment.
    columns:
      - name: appointment_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id
      - name: clinician_id
        tests:
          - relationships:
              to: ref('stg_clinicians')
              field: clinician_id
      - name: facility_id
        tests:
          - relationships:
              to: ref('stg_facilities')
              field: facility_id
      - name: appointment_status
        tests:
          - accepted_values:
              values: ['COMPLETED', 'NO_SHOW', 'CANCELLED']

  - name: stg_encounters
    description: Clean patient encounter data. One row per encounter.
    columns:
      - name: encounter_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - relationships:
              to: ref('stg_patients')
              field: patient_id
      - name: appointment_id
        tests:
          - relationships:
              to: ref('stg_appointments')
              field: appointment_id

  - name: stg_admissions
    description: Clean inpatient admission data. One row per admission.
    columns:
      - name: admission_id
        tests: [not_null, unique]
      - name: patient_id
        tests:
          - relationships:
              to: ref('stg_patients')
              field: patient_id
      - name: facility_id
        tests:
          - relationships:
              to: ref('stg_facilities')
              field: facility_id
