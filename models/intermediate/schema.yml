version: 2

models:
  - name: int_appointment_outcomes
    description: Appointment-level status flags and booking timing.
    columns:
      - name: appointment_id
        tests: [not_null, unique]
      - name: appointment_date
        tests: [not_null]

  - name: int_admission_sequence
    description: Admission rows enriched with each patient's next admission.
    columns:
      - name: admission_id
        tests: [not_null, unique]
      - name: length_of_stay_hours
        tests: [not_null]
