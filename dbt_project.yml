name: 'careflow_health_analytics'
version: '1.0.0'
config-version: 2

profile: 'careflow_health_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Re-read a small recent-history window on incremental appointment builds so
# delayed appointment updates can still be merged without a full rebuild.
vars:
  incremental_lookback_days: 3

models:
  careflow_health_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  careflow_health_analytics:
    +schema: raw
